name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stikerai
          POSTGRES_PASSWORD: stikerai
          POSTGRES_DB: stikerai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stikerai -d stikerai_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
        working-directory: backend
      - run: python scripts/export_types.py --check
        working-directory: backend
      - run: python -m pytest
        working-directory: backend
      - run: python -m alembic upgrade head
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://stikerai:stikerai@localhost:5432/stikerai_test
      - run: python -m pytest
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://stikerai:stikerai@localhost:5432/stikerai_test
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker compose up -d --wait
      - run: docker compose exec -T backend python -m app.seed
      - run: curl --fail http://localhost:5173/api/catalog
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down

name: stikerai
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stikerai}
      POSTGRES_USER: ${POSTGRES_USER:-stikerai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stikerai}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    build:
      context: ./backend
      target: base
    environment: &database_environment
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-stikerai}
      PGPASSWORD: ${POSTGRES_PASSWORD:-stikerai}
      PGDATABASE: ${POSTGRES_DB:-stikerai}
      MIROFISH_ENABLED: ${MIROFISH_ENABLED:-false}
      MIROFISH_BASE_URL: ${MIROFISH_BASE_URL:-}
      MIROFISH_API_TOKEN: ${MIROFISH_API_TOKEN:-}
      MIROFISH_TIMEOUT_SECONDS: ${MIROFISH_TIMEOUT_SECONDS:-45}
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
  seed:
    build:
      context: ./backend
      target: base
    environment: *database_environment
    command: ["python", "-m", "app.seed"]
    depends_on:
      migrate:
        condition: service_completed_successfully
  backend:
    build:
      context: ./backend
      target: development
    environment:
      <<: *database_environment
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-astra}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-45}
    depends_on:
      seed:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    environment:
      API_PROXY_TARGET: http://backend:8000
      WATCH_USE_POLLING: "true"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
